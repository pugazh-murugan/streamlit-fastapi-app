services:
  backend:
    build:
      context: ./backend
    container_name: sample-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: ./frontend
    container_name: sample-frontend
    ports:
      - "8501:8501"
    environment:
      # Service name resolves inside the compose network
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
